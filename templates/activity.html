{% extends "base.html" %}{% block title %}Activity Log{% endblock %}{% block content %}<div class="heading"><h1>Activity Log</h1><p>Recent actions in the demo application.</p></div><div class="panel"><div class="tablewrap"><table><thead><tr><th>#</th><th>Activity</th><th>Date & Time</th></tr></thead><tbody>{% for a in activities %}<tr><td>{{ a.id }}</td><td>{{ a.message }}</td><td>{{ a.created_at }}</td></tr>{% else %}<tr><td colspan="3">No activity recorded yet.</td></tr>{% endfor %}</tbody></table></div></div>{% endblock %}
