{% extends "base.html" %}{% block title %}Register Student{% endblock %}{% block content %}<div class="heading"><h1>Register Student</h1><p>Add student details to the database.</p></div><div class="panel" style="max-width:520px"><form method="post"><label for="student_id">Student ID</label><input id="student_id" name="student_id" placeholder="e.g. 23CSD011" required><label for="name">Student Name</label><input id="name" name="name" placeholder="Enter full name" required><label for="department">Department</label><input id="department" name="department" value="CSD" required><label for="year">Year</label><select id="year" name="year"><option>I</option><option selected>II</option><option>III</option><option>IV</option></select><button class="btn" type="submit" style="margin-top:20px">Save Student</button> <a class="btn graybtn" href="{{ url_for('students') }}">Cancel</a></form></div>{% endblock %}
