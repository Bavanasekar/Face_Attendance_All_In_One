<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login | Face Attendance</title>
<style>*{box-sizing:border-box;font-family:Arial,sans-serif}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,#172554,#4f46e5,#7c3aed)}.box{background:white;width:100%;max-width:390px;padding:36px;border-radius:18px;box-shadow:0 20px 55px #0003}.logo{text-align:center;font-size:42px;color:#4f46e5;margin-bottom:14px}h1{text-align:center;font-size:25px;color:#172033;margin-bottom:8px}.sub{text-align:center;color:#64748b;font-size:14px;line-height:1.5;margin-bottom:24px}label{display:block;font-size:14px;font-weight:bold;margin:15px 0 7px;color:#334155}input{width:100%;padding:13px;border:1px solid #cbd5e1;border-radius:8px;font-size:15px}button{width:100%;padding:13px;margin-top:22px;border:0;border-radius:8px;background:#4f46e5;color:white;font-size:16px;font-weight:bold;cursor:pointer}.error{background:#fee2e2;color:#991b1b;padding:11px;border-radius:7px;margin-bottom:12px;font-size:14px}.demo{text-align:center;margin-top:18px;color:#64748b;font-size:13px;line-height:1.7}</style></head><body>
<div class="box"><div class="logo">⌖</div><h1>Welcome Back</h1><p class="sub">Face Recognition Based<br>Student Attendance System</p>
{% if error %}<div class="error">{{ error }}</div>{% endif %}
<form action="{{ url_for('login') }}" method="post"><label for="username">Username</label><input id="username" name="username" placeholder="Enter username" required><label for="password">Password</label><input id="password" name="password" type="password" placeholder="Enter password" required><button type="submit">Login to Dashboard</button></form>
<div class="demo">Demo login<br><b>Username:</b> admin &nbsp; <b>Password:</b> 1234</div></div></body></html>
